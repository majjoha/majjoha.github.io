---
layout: default
title: "Mathias Jean Johansen"
---

<section>
  {% for post in site.posts %}
  <article>
    <h2>
      <a href="{{ post.url }}">{{ post.title }}</a>
    </h2>
    <time datetime="{{ post.date | date_to_xmlschema }}">
      {{ post.date | date: "%b %d, %Y" }}
    </time>
  </article>
  {% endfor %}
</section>
